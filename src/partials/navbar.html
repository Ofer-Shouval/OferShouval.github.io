  <script>
    // The menu at the right of the navbar: opens and closes with its button, and closes on a press anywhere else or Escape
    (() => {
      const button = document.querySelector('.nav-menu-button');
      const list = button.nextElementSibling;
      const open = (on) => {
        button.setAttribute('aria-expanded', String(on));
        list.hidden = !on;
      };
      // Kept to itself, so the sketches behind it don't take the press as theirs
      for (const type of ['pointerdown', 'mousedown', 'touchstart']) button.addEventListener(type, (event) => event.stopPropagation());
      button.addEventListener('click', (event) => {
        event.stopPropagation();
        open(list.hidden);
      });
      list.addEventListener('pointerdown', (event) => event.stopPropagation());
      document.addEventListener('pointerdown', () => open(false));
      document.addEventListener('keydown', (event) => {
        if (event.key === 'Escape' && !list.hidden) {
          open(false);
          button.focus();
        }
      });
    })();
  </script>
